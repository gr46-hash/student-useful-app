<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Useful App - Girija</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f0f4ff;padding:20px;text-align:center}
h1{font-size:26px;margin-bottom:5px}
.sub{color:#64748b;margin-bottom:15px}
.steps{margin:15px 0;font-weight:700;color:#4f46e5}
.box{background:white;width:360px;max-width:95%;margin:auto;padding:25px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,0.1);text-align:left;display:none}
.box.active{display:block}
label{font-size:14px;font-weight:600;color:#475569}
input{width:100%;padding:12px;margin:6px 0 14px 0;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px}
button{width:100%;padding:13px;background:#22c55e;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:5px}
button.blue{background:#2563eb}
button.grey{background:#94a3b8}
.result{margin-top:15px;padding:12px;border-radius:10px;background:#dcfce7;color:#166534;font-weight:700;text-align:center}
.result.bad{background:#fee2e2;color:#991b1b}
.progress{width:360px;max-width:95%;height:8px;background:#e2e8f0;border-radius:20px;margin:10px auto;overflow:hidden}
.bar{height:100%;background:#4f46e5;width:33%;transition:0.3s}
</style>
</head>
<body>

<h1>🎓 Student Useful App</h1>
<p class="sub">One Touch = Next Step!</p>

<div class="progress"><div id="bar" class="bar"></div></div>
<p class="steps" id="stepText">Step 1 of 3 - Attendance</p>

<!-- STEP 1 -->
<div id="step1" class="box active">
  <h2>📋 Step 1: Attendance</h2><br>
  <label>Total Classes</label>
  <input id="total" type="number" placeholder="Ex: 40">
  <label>Attended Classes</label>
  <input id="attend" type="number" placeholder="Ex: 34">
  <button onclick="goStep2()">Next ➡️ CGPA Check</button>
  <div id="attResult" class="result" style="display:none"></div>
</div>

<!-- STEP 2 -->
<div id="step2" class="box">
  <h2>⭐ Step 2: CGPA</h2><br>
  <label>Sem 1 SGPA</label>
  <input id="s1" type="number" step="0.01" placeholder="Ex: 8.5">
  <label>Sem 2 SGPA</label>
  <input id="s2" type="number" step="0.01" placeholder="Ex: 7.8">
  <button class="grey" onclick="backStep1()">⬅️ Back</button>
  <button class="blue" onclick="goStep3()">Next ➡️ Final Result</button>
  <div id="cgpaResult" class="result" style="display:none;background:#dbeafe;color:#1e40af"></div>
</div>

<!-- STEP 3 -->
<div id="step3" class="box">
  <h2>🎉 Step 3: Final Result</h2><br>
  <p id="finalBox" style="font-size:16px;line-height:1.8"></p>
  <button class="grey" onclick="backStep2()">⬅️ Back</button>
  <button onclick="restart()">🔄 Again Start Pannu</button>
</div>

<script>
let attPer=0, cgpaVal=0;

function show(id, percent, text){
  document.querySelectorAll('.box').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('bar').style.width = percent;
  document.getElementById('stepText').innerText = text;
  window.scrollTo(0,0);
}

function goStep2(){
  let t = Number(document.getElementById("total").value);
  let a = Number(document.getElementById("attend").value);
  if(!t || !a || a>t){ alert("Total + Attended correct ah podu da!"); return; }
  attPer = (a/t*100).toFixed(1);
  let box = document.getElementById("attResult");
  box.style.display="block";
  if(attPer>=75){ box.classList.remove("bad"); box.innerText="Attendance: "+attPer+"% ✅ Safe!"; }
  else{ box.classList.add("bad"); box.innerText="Attendance: "+attPer+"% ❌ Low!"; }
  setTimeout(()=>{ show('step2','66%','Step 2 of 3 - CGPA'); }, 500);
}
function backStep1(){ show('step1','33%','Step 1 of 3 - Attendance'); }
function backStep2(){ show('step2','66%','Step 2 of 3 - CGPA'); }

function goStep3(){
  let s1 = Number(document.getElementById("s1").value);
  let s2 = Number(document.getElementById("s2").value);
  if(!s1 || !s2){ alert("Sem 1 + Sem 2 podu da!"); return; }
  cgpaVal = ((s1+s2)/2).toFixed(2);
  let box = document.getElementById("cgpaResult");
  box.style.display="block";
  box.innerText = "CGPA: "+cgpaVal;
  // Final Result
  let final = document.getElementById("finalBox");
  final.innerHTML = "👤 <b>Girija</b><br>📋 Attendance: <b>"+attPer+"%</b> "+(attPer>=75?"✅ Safe":"❌ Need More Class")+"<br>⭐ CGPA: <b>"+cgpaVal+"</b><br><br>🎯 <b>Overall:</b> " + (attPer>=75 && cgpaVal>=7 ? "Super da! Placement Ready! 🔥" : "Nalla pora da! Konjam push pannu! 💪");
  setTimeout(()=>{ show('step3','100%','Step 3 of 3 - Final Result'); }, 500);
}
function restart(){
  document.getElementById("total").value="";
  document.getElementById("attend").value="";
  document.getElementById("s1").value="";
  document.getElementById("s2").value="";
  document.getElementById("attResult").style.display="none";
  document.getElementById("cgpaResult").style.display="none";
  show('step1','33%','Step 1 of 3 - Attendance');
}
</script>
</body>
</html>
